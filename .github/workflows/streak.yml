name: Update streak card

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/streak.py chanchalvdev 2021 streak.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- streak.svg; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git commit -m "Update streak card"
          git push
